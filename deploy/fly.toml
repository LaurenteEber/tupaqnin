# DO NOT DEPLOY publicly until invitation access (B3-3, specification §6)
# is implemented: the app currently has no authentication.
app = "tupaqnin"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    type = "http"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[mounts]
  source = "tupaqnin_data"
  destination = "/data"

[env]
  PORT = "8080"
  TQ_DATA_DIR = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
