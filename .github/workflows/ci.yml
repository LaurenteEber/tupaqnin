name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      # Non-blocking: new stdlib disclosures would otherwise keep CI red
      # until a patched Go release exists. Results stay visible in the log.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        continue-on-error: true
